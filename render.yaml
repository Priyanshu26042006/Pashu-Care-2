services:
  - type: web
    name: gausehat-ai-livestock
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
